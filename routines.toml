# Scheduled routines shown on the dashboard's "Scheduled Routines" group.
# Edit this file to add, remove, or retune a routine — no code changes needed.
# (The Claude control-plane service checks are separate and live in code.)
#
# Each [[routine]] picks a `signal`, which selects a detector:
#
#   systemd-timer   — a systemd --user timer/service whose runner appends a
#                     "=== run finished rc=N at <iso> ===" line to a log.
#       service     (required) the .service unit
#       unit        (optional) the .timer unit — checked active
#       log_glob    (optional) glob of run logs; newest is read for the rc marker
#       schedule    (optional) expected local "HH:MM" — drives "next run"
#       stale_after (optional) warn if the last run is older than this (def 26h)
#
#   git-commit-age  — success shows up as a fresh commit in a repo (e.g. an
#                     off-host agent that publishes by committing).
#       repo        (required) path to the git repo (~ is expanded)
#       grep        (optional) only count commits whose subject matches this
#       warn_after / fail_after  (optional) age thresholds (def 26h / 50h)
#       schedule    (optional) expected local "HH:MM"
#
#   systemd-service — a long-running systemd --user service (no timer, no
#                     log): up/down from unit state, restart-loop detection.
#       service       (required) the .service unit
#       warn_restarts (optional) warn once NRestarts reaches this (def 3)
#
#   process-match   — the routine is itself a long-running process.
#       match       (required) a substring, or list of substrings all of which
#                   must appear in the process command line
#
# Any [[routine]] may set `group = "..."` to place its card under a different
# dashboard heading (default "Scheduled Routines").
#
# Durations accept 26h, 90m, 2h30m, 45s, or a plain number of seconds.

[[routine]]
id = "daily-research"
signal = "systemd-timer"
service = "daily-research.service"
unit = "daily-research.timer"
log_glob = "~/routines/logs/daily-research-*.log"
schedule = "22:02"
stale_after = "26h"
note = "systemd user timer on workbench · nightly 22:02"

[[routine]]
id = "daily-blog-post"
signal = "git-commit-age"
repo = "~/projects/iter8lab.net"
grep = "^Add:"
schedule = "23:02"
warn_after = "26h"
fail_after = "50h"
note = "cloud agent (off-host) · publishes ~23:00 · health from commits"

[[routine]]
id = "claude-config-check"
signal = "systemd-timer"
service = "claude-config-check.service"
unit = "claude-config-check.timer"
log_glob = "~/routines/logs/claude-config-check-*.log"
schedule = "09:05"
stale_after = "26h"
note = "systemd user timer on workbench \u00b7 daily 09:05 \u00b7 shared ~/.claude config drift vs projects-root claude/"

[[routine]]
id = "claude-backup"
signal = "systemd-timer"
service = "claude-backup.service"
unit = "claude-backup.timer"
log_glob = "~/routines/logs/claude-backup-*.log"
schedule = "07:15,19:15"
stale_after = "14h"
note = "systemd user timer on workbench \u00b7 07:15 and 19:15 \u00b7 snapshots ~/.claude to claude-code-backup-workbench"

# --- Claude Remote Control servers (claude-rc.service + claude-rc@<repo>) ---
# One persistent `claude remote-control` per repo so the workbench sessions
# are always listed in claude.ai/code, the desktop app, and the mobile app.
# Unit files: Homelab infrastructure/kvm-cluster/systemd/workbench/.

[[routine]]
id = "claude-rc-root"
group = "Remote Control"
name = "workbench (projects root)"
signal = "systemd-service"
service = "claude-rc.service"
note = "~/projects · spawn same-dir · permission auto"

[[routine]]
id = "claude-rc-Homelab"
group = "Remote Control"
name = "workbench-Homelab"
signal = "systemd-service"
service = "claude-rc@Homelab.service"
note = "~/projects/Homelab · spawn worktree · permission auto"

